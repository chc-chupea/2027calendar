<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2027カレンダー｜営業所管理</title>
<style>
:root{--ink:#283039;--muted:#727d86;--line:#dfe5ea;--blue:#4f8fc7;--wait:#fff4df;--ready:#eaf7ef;--done:#f0f1f3}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#f5f7f9;color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 15px}
.bar{max-width:1260px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:18px;margin:0}.sub{font-size:11px;color:var(--muted);margin-top:3px}
button,a.btn{border:0;border-radius:8px;padding:10px 12px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}
.wrap{max-width:1260px;margin:16px auto;padding:0 14px 40px}
.login{max-width:440px;margin:50px auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px}
.login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;margin:5px 0 10px}
.primary{background:var(--blue);color:#fff}.ghost{background:#fff;border:1px solid var(--line);color:#44515b}
.hidden{display:none!important}
.pin-line{display:flex;gap:8px;align-items:center}
.login .pin-line input{flex:1;min-width:0}
.pin-eye{flex:0 0 auto;background:#eef5fb;border:1px solid #bfd4e6;color:#315c7f;padding:12px 9px;min-width:65px}
.auto-panel{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.auto-copy{font-size:12px;color:var(--muted)}.auto-toggle{min-width:145px;background:#f0f2f4;color:#56616b}.auto-toggle.on{background:#e8f6ee;color:#286342}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}.filters button{background:#fff;border:1px solid var(--line);color:#53606a}.filters button.active{background:#3b4852;color:#fff}
.stats{font-size:12px;color:var(--muted);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.thumb{background:#eef1f3;display:flex;align-items:center;justify-content:center;min-height:180px}.thumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.body{padding:13px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.num{font-size:24px;font-weight:900}.badge{padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900}
.WAIT{background:var(--wait);color:#7e5915}.UPLOADING{background:#eaf2ff;color:#3d5f99}.UPLOAD_ERROR{background:#ffefed;color:#a2382d}.READY{background:var(--ready);color:#286342}.DONE{background:var(--done);color:#656b70}
.meta{font-size:12px;line-height:1.6;color:var(--muted);margin:8px 0}.personal{background:#f8fafb;border:1px solid #e4e9ed;border-radius:8px;padding:10px;font-size:12px;line-height:1.7;margin:9px 0}.personal b{color:#39444c}
.note{white-space:pre-wrap}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions .wide{grid-column:1/-1}.print{background:#36424b;color:#fff}.png{background:#edf4fa;color:#456b8b}
.state-toggles{display:grid;grid-template-columns:1fr 1fr;gap:7px;grid-column:1/-1}.state-toggle{background:#fff;border:1px solid var(--line);color:#58646d}.state-toggle.on{background:#e9f6ee;color:#2b6748}.state-toggle.delivered{background:#eff0f2;color:#535b61}.state-toggle:disabled{opacity:.4}
.cleanup{background:#fff7e9;color:#785716;border:1px solid #eedebc}
.empty{padding:40px;text-align:center;color:#7d8790;background:#fff;border-radius:10px}
@media(max-width:640px){.grid{grid-template-columns:1fr}.bar{align-items:flex-start}}

.label-tools{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;margin-bottom:12px
}
.label-tools .count{font-size:12px;color:var(--muted);margin-right:auto}
.label-btn{background:#566a78;color:#fff}
.label-clear{background:#fff;border:1px solid var(--line);color:#58646d}
.select-wrap{display:flex;align-items:center;gap:7px;font-size:11px;color:#6a747c;margin:0 0 8px}
.select-wrap input{width:18px;height:18px}


.pii-tools{
  background:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px 14px;
  margin-bottom:12px;
}
.pii-tools-title{
  font-weight:900;
  font-size:13px;
  margin-bottom:5px;
}
.pii-tools-note{
  font-size:11px;
  color:var(--muted);
  line-height:1.55;
  margin-bottom:10px;
}
.pii-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.csv-btn{
  background:#3d728e;
  color:#fff;
}
.pii-delete-btn{
  background:#fff1ef;
  color:#a2382d;
  border:1px solid #efcac5;
}
.pii-deleted{
  background:#f1f3f4;
  border:1px solid #e0e4e7;
  color:#646d74;
  border-radius:8px;
  padding:10px;
  margin:9px 0;
  font-size:12px;
  font-weight:800;
}

</style>
</head>
<body>
<header>
  <div class="bar">
    <div><h1 id="title">2027カレンダー｜営業所管理</h1><div class="sub"><span id="shopName">営業所</span> ／ <span id="shopIdText"></span></div></div>
    <div><button id="cleanupBtn" class="cleanup hidden">期限超過写真を削除</button> <button id="logoutBtn" class="ghost hidden">ログアウト</button></div>
  </div>
</header>

<main class="wrap">
  <section id="loginPanel" class="login">
    <h2>スタッフ用 管理画面</h2>
    <p class="sub">営業所の4桁管理パスワードを入力してください。</p>
    <div class="pin-line"><input id="password" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" placeholder="4桁の数字"><button type="button" id="togglePin" class="pin-eye" aria-label="PINを表示" aria-pressed="false">👁 表示</button></div>
    <button id="loginBtn" class="primary">開く</button>
    <div id="loginMsg" class="sub" style="margin-top:10px"></div>
  </section>

  <section id="appPanel" class="hidden">
    <div class="auto-panel">
      <div><b>このPCの自動印刷</b><div class="auto-copy" id="autoNote">OFF：受付が来たら「印刷」を押します。</div></div>
      <button id="autoToggle" class="auto-toggle">自動印刷 OFF</button>
    </div>

    <div class="pii-tools">
      <div class="pii-tools-title">個人情報の保存・削除</div>
      <div class="pii-tools-note">
        受渡済みの受付情報をCSVで保存できます。個人情報削除は、CSV保存済みの受渡済みデータだけが対象です。
      </div>
      <div class="pii-actions">
        <button id="exportPiiCsvBtn" class="csv-btn">受渡済みの個人情報をCSV保存</button>
        <button id="deleteExportedPiiBtn" class="pii-delete-btn">CSV保存済みの個人情報を削除</button>
      </div>
    </div>

    <div class="label-tools">
      <div class="count">ラベル選択：<b id="labelCount">0</b>件 / 12件</div>
      <button id="selectFirst12Btn" class="ghost">表示中から12件選択</button>
      <button id="clearLabelsBtn" class="label-clear">選択解除</button>
      <button id="printLabelsBtn" class="label-btn">お届け用ラベル印刷</button>
    </div>

    <div class="filters">
      <button class="active" data-filter="WAIT">未印刷</button>
      <button data-filter="UPLOAD_ERROR">送信エラー</button>
      <button data-filter="UPLOADING">送信中</button>
      <button data-filter="READY">印刷済み</button>
      <button data-filter="DONE">受渡済み</button>
      <button data-filter="ALL">すべて</button>
    </div>
    <div id="stats" class="stats">読み込み中…</div>
    <div id="grid" class="grid"></div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
  getFirestore, collection, query, where, doc, getDoc, updateDoc, writeBatch,
  serverTimestamp, onSnapshot, runTransaction, Timestamp, deleteField
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
import { getStorage, ref, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-storage.js";
import {
  getAuth, signInWithCustomToken, signOut, onAuthStateChanged, getIdTokenResult
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-functions.js";

const firebaseConfig={
  apiKey:"AIzaSyBKSYZgaSVTu-HO_lS1Tp2eFjSjMuOONNI",
  authDomain:"my-uchiwa-queue.firebaseapp.com",
  projectId:"my-uchiwa-queue",
  storageBucket:"my-uchiwa-queue.firebasestorage.app",
  messagingSenderId:"245883628081",
  appId:"1:245883628081:web:ab7f00f01ba256ebca8310",
  measurementId:"G-W4S3EKL9TY"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app), storage=getStorage(app), auth=getAuth(app), functions=getFunctions(app,"asia-northeast1");
const SOURCE="annual-photo-calendar-2027";
const params=new URLSearchParams(location.search);
const shopId=(params.get("shop")||"main").replace(/[^a-zA-Z0-9_-]/g,"")||"main";
const DAY=24*60*60*1000;

let shopSettings={shopName:"カレンダー受付営業所",shopCode:"C"};
let all=[], filter="WAIT", unsub=null, snapshotInitialized=false;
let selectedLabels=new Set();
const grid=document.getElementById("grid"), stats=document.getElementById("stats");

const AUTO_KEY=`annual-calendar-autoprint:${shopId}`;
let autoEnabled=localStorage.getItem(AUTO_KEY)==="1";
let printQueue=[], printBusy=false, queued=new Set();

function esc(s){return String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function ts(v){try{return v?.toMillis?.()||0}catch{return 0}}
function fmt(v){try{return v?.toDate?.().toLocaleString("ja-JP")||""}catch{return ""}}
function money(v){return Number(v)>0?`${Number(v).toLocaleString("ja-JP")}円`:"—"}

async function loadSettings(){
  try{
    const s=await getDoc(doc(db,"settings",shopId));
    if(s.exists()) shopSettings={...shopSettings,...s.data()};
  }catch(e){console.error(e)}
  document.getElementById("shopName").textContent=shopSettings.shopName||"営業所";
  document.getElementById("shopIdText").textContent=`shop=${shopId}`;
  document.getElementById("title").textContent=`${shopSettings.shopName||"営業所"}｜2027カレンダー管理`;
  document.title=`${shopSettings.shopName||"営業所"}｜2027カレンダー管理`;
}

document.getElementById("togglePin").onclick=()=>{
  const input=document.getElementById("password"),btn=document.getElementById("togglePin");
  const show=input.type==="password";
  input.type=show?"text":"password";
  btn.textContent=show?"🙈 隠す":"👁 表示";
  btn.setAttribute("aria-pressed",String(show));
  btn.setAttribute("aria-label",show?"PINを隠す":"PINを表示");
};
document.getElementById("loginBtn").onclick=async()=>{
  const pin=document.getElementById("password").value.trim();
  const msg=document.getElementById("loginMsg");

  if(!/^\d{4}$/.test(pin)){
    msg.textContent="数字4桁で入力してください。";
    return;
  }

  msg.textContent="確認中…";
  document.getElementById("loginBtn").disabled=true;
  try{
    const login=httpsCallable(functions,"loginAnnual2027Admin");
    const result=await login({shopId,pin});
    const token=result.data?.token;
    if(!token) throw new Error("token-not-returned");
    await signInWithCustomToken(auth,token);
    msg.textContent="";
  }catch(e){
    console.error(e);
    const code=e?.code||"unknown";
    msg.textContent=code==="functions/resource-exhausted"
      ?"入力回数が多いため、しばらく待ってからお試しください。"
      :code==="functions/unauthenticated" || code==="functions/permission-denied" || code==="functions/invalid-argument" || code==="functions/failed-precondition"
        ?`PIN認証に失敗しました（${code}）。営業所IDと設定済みPINをご確認ください。`
        :`ログイン処理に失敗しました（${code}）。通信またはFirebase側の設定を確認してください。`;
  }finally{
    document.getElementById("loginBtn").disabled=false;
  }
};
document.getElementById("password").addEventListener("keydown",e=>{
  if(e.key==="Enter") document.getElementById("loginBtn").click();
});
document.getElementById("logoutBtn").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async user=>{
  let allowed=false;
  if(user){
    try{
      const token=await getIdTokenResult(user,true);
      allowed =
        (token.claims.role==="annual2027Admin" && token.claims.shopId===shopId) ||
        (user.email && user.email.toLowerCase()==="sp-fureai@soleil.ocn.ne.jp");
    }catch(e){ console.error(e); }
  }

  document.getElementById("loginPanel").classList.toggle("hidden",allowed);
  document.getElementById("appPanel").classList.toggle("hidden",!allowed);
  document.getElementById("logoutBtn").classList.toggle("hidden",!allowed);
  document.getElementById("cleanupBtn").classList.toggle("hidden",!allowed);

  if(allowed){
    await loadSettings();
    startWatch();
  }else if(unsub){
    unsub(); unsub=null;
  }
});

function updateAutoUI(){
  const b=document.getElementById("autoToggle"),n=document.getElementById("autoNote");
  b.classList.toggle("on",autoEnabled);
  b.textContent=autoEnabled?"自動印刷 ON":"自動印刷 OFF";
  n.textContent=autoEnabled
    ?"ON：新しく届いた受付を、このPCで自動印刷します。"
    :"OFF：受付が来たら「印刷」を押します。";
}
document.getElementById("autoToggle").onclick=()=>{
  autoEnabled=!autoEnabled;
  localStorage.setItem(AUTO_KEY,autoEnabled?"1":"0");
  updateAutoUI();
};
updateAutoUI();

function startWatch(){
  if(unsub)unsub();
  snapshotInitialized=false;
  const q=query(collection(db,"orders"),where("shopId","==",shopId));
  unsub=onSnapshot(q,async snap=>{
    all=snap.docs.map(d=>({id:d.id,...d.data()}))
      .filter(o=>o.source===SOURCE)
      .sort((a,b)=>ts(b.createdAt)-ts(a.createdAt));
    render();
    await hydrateImages();

    if(!snapshotInitialized){snapshotInitialized=true;cleanupExpiredPhotos(false);return}
    if(autoEnabled){
      for(const ch of snap.docChanges()){
        if(ch.type!=="added" && ch.type!=="modified")continue;
        const o={id:ch.doc.id,...ch.doc.data()};
        if(o.source===SOURCE && (o.status||"WAIT")==="WAIT" && o.storagePath && !o.autoPrintState) enqueuePrint(o);
      }
    }
  },err=>{
    console.error(err);stats.textContent="データを取得できませんでした。";
  });
}

function render(){
  const list=filter==="ALL"?all:all.filter(x=>(x.status||"WAIT")===filter);
  stats.textContent=`全 ${all.length}件 ／ 表示 ${list.length}件`;
  if(!list.length){grid.innerHTML='<div class="empty">該当する受付はありません。</div>';updateLabelCount();return}

  grid.innerHTML=list.map(o=>{
    const st=o.status||"WAIT";
    const printed=st==="READY"||st==="DONE";
    const delivered=st==="DONE";
    const deleted=!!o.photoDeletedAt;
    const psize=o.paperSize||"A4";
    const landscape=o.orientation==="landscape";
    const pLabel=`${psize}${landscape?"横":"縦"}`;
    const survey=o.surveyAnswer?`<br><b>アンケート：</b>${esc(o.surveyAnswer)}`:"";
    const note=o.freeNote?`<div class="note"><b>自由記述：</b>${esc(o.freeNote)}</div>`:"";
    const consent=o.noticeConsent?"お知らせ利用：同意あり":"お知らせ利用：同意なし";
    const expiry=o.photoDeleteAfter?`<br>写真削除予定：${fmt(o.photoDeleteAfter)}`:"";
    const piiDeleted=!!o.piiDeletedAt;
    return `<article class="card" data-id="${o.id}">
      <div class="body" style="padding-bottom:0">
        <label class="select-wrap">
          <input type="checkbox" class="label-select" data-id="${o.id}" ${selectedLabels.has(o.id)?"checked":""} ${piiDeleted?"disabled":""}>
          <span>${piiDeleted?"個人情報削除済み":"お届け用ラベルに入れる"}</span>
        </label>
      </div>
      <div class="thumb" id="thumb-${o.id}">${deleted?"写真削除済み":"画像を読み込み中…"}</div>
      <div class="body">
        <div class="top"><div class="num">${esc(o.shortId||o.id)}</div><span class="badge ${st}">${st}</span></div>
        <div class="meta">${fmt(o.createdAt)}<br>${pLabel} ／ ${o.layoutLabel||""} ／ ${o.copies||1}枚 ／ ${money(o.totalPrice)}${o.firstCopyFree?"（1枚目無料）":""}${expiry}</div>
        ${piiDeleted
          ? `<div class="pii-deleted">個人情報削除済み ${fmt(o.piiDeletedAt)}</div>`
          : `<div class="personal">
              <b>お名前：</b>${esc(o.customerName)}<br>
              <b>住所：</b>${esc(o.address)}<br>
              <b>電話：</b>${esc(o.phone)}<br>
              <b>${consent}</b>${survey}
            </div>${note}`
        }
        <div class="actions">
          <button class="print" data-action="print" ${deleted||!o.storagePath?"disabled":""}>${deleted?"写真削除済み":"印刷"}</button>
          <button class="png" data-action="open" ${deleted||!o.storagePath?"disabled":""}>画像を開く</button>
          <div class="state-toggles">
            <button class="state-toggle ${printed?"on":""}" data-action="toggle-print">${printed?"印刷済":"印刷未"}</button>
            <button class="state-toggle ${delivered?"delivered":""}" data-action="toggle-delivery" ${!printed&&!delivered?"disabled":""}>${delivered?"受渡済":"受渡未"}</button>
          </div>
        </div>
      </div>
    </article>`;
  }).join("");
  updateLabelCount();
}

async function imageUrlFor(o){
  if(!o.storagePath || o.photoDeletedAt)return "";
  if(o._url)return o._url;
  o._url=await getDownloadURL(ref(storage,o.storagePath));
  return o._url;
}
async function hydrateImages(){
  for(const o of all){
    const el=document.getElementById(`thumb-${o.id}`);
    if(!el || o.photoDeletedAt || !o.storagePath)continue;
    try{
      const url=await imageUrlFor(o);
      el.innerHTML=`<img src="${url}" alt="${esc(o.shortId||"")}">`;
    }catch(e){
      console.error(e);el.textContent="画像を取得できません";
    }
  }
}

function printWindow(url,o){
  const paper=(o.paperSize||"A4").toUpperCase();
  const isLandscape=o.orientation==="landscape";
  const pageSize=`${paper} ${isLandscape?"landscape":"portrait"}`;
  const dims=paper==="A3"
    ? (isLandscape?["420mm","297mm"]:["297mm","420mm"])
    : (isLandscape?["297mm","210mm"]:["210mm","297mm"]);
  const count=Math.max(1,Math.min(10,Number(o.copies)||1));
  const w=window.open("","_blank");
  if(!w){alert("ポップアップがブロックされました。");return}
  const pages=Array.from({length:count},()=>`<section><img src="${url}"></section>`).join("");
  w.document.write(`<!doctype html><html><head><title>印刷</title><style>
    @page{size:${pageSize};margin:0}
    html,body{margin:0;padding:0}
    section{width:${dims[0]};height:${dims[1]};page-break-after:always}
    section:last-child{page-break-after:auto}
    img{width:100%;height:100%;object-fit:fill;display:block}
  </style></head><body>${pages}<script>
    Promise.all([...document.images].map(i=>i.complete?Promise.resolve():new Promise(r=>i.onload=r)))
      .then(()=>setTimeout(()=>window.print(),250));
  <\/script></body></html>`);
  w.document.close();
}

grid.addEventListener("click",async e=>{
  const b=e.target.closest("[data-action]");if(!b)return;
  const card=e.target.closest(".card"),id=card?.dataset.id;
  const o=all.find(x=>x.id===id);if(!o)return;

  try{
    if(b.dataset.action==="print"){
      const url=await imageUrlFor(o);printWindow(url,o);return;
    }
    if(b.dataset.action==="open"){
      const url=await imageUrlFor(o);window.open(url,"_blank","noopener");return;
    }
    if(b.dataset.action==="toggle-print"){
      const st=o.status||"WAIT";
      const next=(st==="READY"||st==="DONE")?"WAIT":"READY";
      const patch={status:next,updatedAt:serverTimestamp()};
      if(next==="WAIT"){
        patch.deliveredAt=deleteField();patch.photoDeleteAfter=deleteField();
      }
      await updateDoc(doc(db,"orders",id),patch);return;
    }
    if(b.dataset.action==="toggle-delivery"){
      const st=o.status||"WAIT";
      if(st==="READY"){
        const deleteAfter=Timestamp.fromDate(new Date(Date.now()+7*DAY));
        await updateDoc(doc(db,"orders",id),{
          status:"DONE",
          deliveredAt:serverTimestamp(),
          photoDeleteAfter:deleteAfter,
          updatedAt:serverTimestamp()
        });
      }else if(st==="DONE"){
        await updateDoc(doc(db,"orders",id),{
          status:"READY",
          deliveredAt:deleteField(),
          photoDeleteAfter:deleteField(),
          updatedAt:serverTimestamp()
        });
      }
    }
  }catch(err){console.error(err);alert("更新できませんでした。")}
});

document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("[data-filter]").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");filter=b.dataset.filter;render();hydrateImages();
});

async function cleanupExpiredPhotos(showResult=true){
  let deleted=0,failed=0;
  const now=Date.now();
  for(const o of all){
    if(o.photoDeletedAt || !o.storagePath || !o.photoDeleteAfter)continue;
    if(ts(o.photoDeleteAfter)>now)continue;
    try{
      await deleteObject(ref(storage,o.storagePath));
      await updateDoc(doc(db,"orders",o.id),{
        photoDeletedAt:serverTimestamp(),
        storagePath:deleteField(),
        updatedAt:serverTimestamp()
      });
      deleted++;
    }catch(e){console.error(e);failed++}
  }
  if(showResult) alert(`削除完了：${deleted}件${failed?` ／ 失敗：${failed}件`:""}`);
}

function silentPrintImage(url,o){
  return new Promise((resolve,reject)=>{
    const paper=(o.paperSize||"A4").toUpperCase();
    const isLandscape=o.orientation==="landscape";
    const pageSize=`${paper} ${isLandscape?"landscape":"portrait"}`;
    const dims=paper==="A3"
      ? (isLandscape?["420mm","297mm"]:["297mm","420mm"])
      : (isLandscape?["297mm","210mm"]:["210mm","297mm"]);
    const count=Math.max(1,Math.min(10,Number(o.copies)||1));

    const iframe=document.createElement("iframe");
    iframe.setAttribute("aria-hidden","true");
    iframe.style.cssText="position:fixed;right:-10000px;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none";
    document.body.appendChild(iframe);

    const pages=Array.from({length:count},()=>`<section><img src="${url}"></section>`).join("");
    const html=`<!doctype html><html><head><meta charset="utf-8"><title>自動印刷</title><style>
      @page{size:${pageSize};margin:0}
      html,body{margin:0;padding:0}
      section{width:${dims[0]};height:${dims[1]};page-break-after:always}
      section:last-child{page-break-after:auto}
      img{width:100%;height:100%;object-fit:fill;display:block}
    </style></head><body>${pages}</body></html>`;

    let done=false;
    const finish=(ok,err)=>{
      if(done)return;done=true;
      setTimeout(()=>iframe.remove(),400);
      ok?resolve():reject(err||new Error("auto-print-failed"));
    };

    iframe.onload=()=>{
      try{
        const idoc=iframe.contentDocument;
        const imgs=[...idoc.images];
        Promise.all(imgs.map(i=>i.complete?Promise.resolve():new Promise((res,rej)=>{
          i.addEventListener("load",res,{once:true});
          i.addEventListener("error",()=>rej(new Error("print-image-load-failed")),{once:true});
        }))).then(()=>{
          const iw=iframe.contentWindow;
          const fallback=setTimeout(()=>finish(true),4500);
          iw.addEventListener("afterprint",()=>{clearTimeout(fallback);finish(true)},{once:true});
          iw.focus();
          setTimeout(()=>iw.print(),250);
        }).catch(e=>finish(false,e));
      }catch(e){finish(false,e)}
    };
    iframe.srcdoc=html;
  });
}



function csvEscape(value){
  const s=String(value??"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  return `"${s.replace(/"/g,'""')}"`;
}

function dateForFilename(){
  const d=new Date();
  const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`;
}

function safeFilename(s){
  return String(s||"営業所").replace(/[\\/:*?"<>|]/g,"_").replace(/\s+/g,"_");
}

function piiExportTargets(){
  return all.filter(o=>
    (o.status||"WAIT")==="DONE" &&
    !o.piiDeletedAt &&
    (o.customerName || o.address || o.phone || o.freeNote || o.surveyAnswer)
  );
}

function csvRowsForPii(orders){
  const headers=[
    "受付番号","受付日時","受渡日時","営業所",
    "お名前","住所","電話番号","自由記述",
    "アンケート質問","アンケート回答",
    "用紙サイズ","写真レイアウト","枚数","料金",
    "お知らせ利用同意"
  ];

  const rows=orders.map(o=>[
    o.shortId||"",
    fmt(o.createdAt),
    fmt(o.deliveredAt),
    o.shopName||shopSettings.shopName||"",
    o.customerName||"",
    o.address||"",
    o.phone||"",
    o.freeNote||"",
    o.surveyQuestion||"",
    o.surveyAnswer||"",
    o.paperSize||"",
    o.layoutLabel||"",
    o.copies||1,
    o.totalPrice||0,
    o.noticeConsent?"同意":""
  ]);

  return [headers,...rows].map(row=>row.map(csvEscape).join(",")).join("\r\n");
}

async function markPiiExported(orders){
  // 400件ずつバッチ更新（Firestore上限500に余裕を持たせる）
  for(let i=0;i<orders.length;i+=400){
    const batch=writeBatch(db);
    for(const o of orders.slice(i,i+400)){
      batch.update(doc(db,"orders",o.id),{
        piiCsvExportedAt:serverTimestamp(),
        updatedAt:serverTimestamp()
      });
    }
    await batch.commit();
  }
}

function labelText(s,max=120){
  const v=String(s??"").replace(/\s+/g," ").trim();
  return v.length>max ? v.slice(0,max-1)+"…" : v;
}
// 単一回答・複数回答・質問と回答の組み合わせに対応。
function surveyEntries(o){
  const entries=[];
  const add=(q,a)=>{
    if(a===null||a===undefined||a==="")return;
    if(Array.isArray(a)){a.forEach(x=>add(q,x));return}
    if(typeof a==="object"){
      if("answer" in a || "value" in a || "text" in a){
        add(a.question||a.label||q,a.answer??a.value??a.text);
      }else Object.entries(a).forEach(([k,v])=>add(k,v));
      return;
    }
    entries.push({question:String(q||""),answer:String(a)});
  };
  // 複数回答の構造化データを優先。旧形式 surveyAnswer は同じ回答の
  // 連結テキストを保持する場合があるため、構造化データがあれば併記しない。
  if(o.surveyAnswers!==undefined && o.surveyAnswers!==null) add("",o.surveyAnswers);
  if(o.surveyResponses!==undefined && o.surveyResponses!==null) add("",o.surveyResponses);
  if(entries.length===0 && o.surveyAnswer!==undefined && o.surveyAnswer!==null){
    add(o.surveyQuestion||"",o.surveyAnswer);
  }
  const seen=new Set();
  return entries.filter(x=>{
    const key=x.question+"\u0000"+x.answer;
    if(seen.has(key))return false;
    seen.add(key);return true;
  });
}
function makeLabelHtml(o){
  const spec=[
    o.paperSize||"A4",
    o.layoutLabel||"",
    `${o.copies||1}枚`,
    Number.isFinite(Number(o.totalPrice)) ? `${Number(o.totalPrice).toLocaleString("ja-JP")}円` : ""
  ].filter(Boolean).join(" / ");
  const survey=surveyEntries(o);
  const surveyHtml=survey.length
    ? survey.map((x,i)=>`<div class="survey-item"><b>${i===0?"アンケート：":""}</b>${x.question?`<span class="survey-question">${esc(x.question)}：</span>`:""}${esc(x.answer)}</div>`).join("")
    : '<div class="survey-item"><b>アンケート：</b>—</div>';
  return `<div class="label">
    <div class="label-content">
      <div class="label-top">
        <div class="name">${esc(labelText(o.customerName,80))} 様</div>
        <div class="receipt">${esc(o.shortId||"")}</div>
      </div>
      <div class="address">${esc(o.address||"")}</div>
      <div class="phone"><b>TEL：</b>${esc(o.phone||"—")}</div>
      <div class="spec">${esc(spec)}</div>
      <div class="note"><b>自由記述：</b>${esc(o.freeNote||"—")}</div>
      <div class="survey">${surveyHtml}</div>
    </div>
  </div>`;
}

    .name{font-size:10pt;font-weight:800;min-width:0;overflow-wrap:anywhere}
    .receipt{font-size:7pt;font-weight:800;white-space:nowrap;flex-shrink:0}
    .address{font-size:8.1pt;font-weight:600;margin-top:.5mm;white-space:normal}
    .phone{font-size:7.4pt;margin-top:.2mm}

    .survey-question{font-weight:700}
    .blank{visibility:hidden}
  </style></head><body>
    <div class="sheet">${labels}${blanks}</div>
    <script>
      window.onload=()=>{
        // 各ラベル内で文字量に合わせて自動的に縮小。12面の用紙サイズ・配置は固定。
        document.querySelectorAll('.label:not(.blank)').forEach(label=>{
          const content=label.querySelector('.label-content');
          const css=getComputedStyle(label);
          const availableH=label.clientHeight-parseFloat(css.paddingTop)-parseFloat(css.paddingBottom);
          const availableW=label.clientWidth-parseFloat(css.paddingLeft)-parseFloat(css.paddingRight);
          let scale=1;
          // scaleだけでは折返し数が変わらないため、幅も合わせて広げて再計測。
          for(let n=0;n<45;n++){
            content.style.width=(100/scale)+'%';
            content.style.transform='scale('+scale+')';
            const fits=content.scrollHeight*scale<=availableH-.6 && content.scrollWidth*scale<=availableW+.6;
            if(fits)break;
            scale*=.96;
          }
        });
        setTimeout(()=>window.print(),300);
      };
    <\/script>
  </body></html>`);
  w.document.close();
}

function enqueuePrint(o){
  if(queued.has(o.id))return;
  queued.add(o.id);printQueue.push(o);processPrintQueue();
}
async function claimPrint(id){
  const r=doc(db,"orders",id);
  return runTransaction(db,async tx=>{
    const s=await tx.get(r);if(!s.exists())return null;
    const d=s.data();
    if((d.status||"WAIT")!=="WAIT" || d.autoPrintState || !d.storagePath)return null;
    tx.update(r,{autoPrintState:"PRINTING",autoPrintStartedAt:serverTimestamp(),updatedAt:serverTimestamp()});
    return {id,...d};
  });
}
async function processPrintQueue(){
  if(printBusy||!autoEnabled)return;
  const next=printQueue.shift();if(!next)return;
  printBusy=true;
  try{
    const o=await claimPrint(next.id);
    if(o){
      const url=await imageUrlFor(o);
      await silentPrintImage(url,o);
      await updateDoc(doc(db,"orders",o.id),{
        status:"READY",autoPrintState:"PRINTED",autoPrintCompletedAt:serverTimestamp(),updatedAt:serverTimestamp()
      });
    }
  }catch(e){
    console.error(e);
    try{await updateDoc(doc(db,"orders",next.id),{autoPrintState:"ERROR",updatedAt:serverTimestamp()})}catch(_){}
  }finally{
    queued.delete(next.id);printBusy=false;
    if(printQueue.length&&autoEnabled)setTimeout(processPrintQueue,400);
  }
}
