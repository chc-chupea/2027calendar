<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2027カレンダー｜営業所設定</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
  background:#f5f7f9;color:#29323a
}
.wrap{max-width:760px;margin:30px auto;padding:0 14px}
.card{
  background:#fff;border:1px solid #dfe5ea;border-radius:12px;
  padding:20px;margin-bottom:14px
}
h1{font-size:22px;margin:0 0 10px}
h2{font-size:21px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
label{display:grid;gap:6px;font-size:12px;font-weight:800;color:#56616b}
input,textarea,select{
  width:100%;padding:12px;border:1px solid #dfe5ea;border-radius:8px;
  font:inherit;background:#fff;color:#29323a
}
textarea{min-height:110px}
button{
  border:0;border-radius:8px;padding:12px 14px;font-weight:900;cursor:pointer
}
.primary{background:#4f8fc7;color:#fff}
.ghost{background:#fff;border:1px solid #dfe5ea;color:#53606a}
.links{display:grid;gap:9px;margin-top:16px}
.url{background:#f7f9fb;padding:10px;border-radius:7px;font-size:12px;word-break:break-all}
.hidden{display:none!important}
.msg{font-size:12px;color:#6f7982;margin-top:8px;line-height:1.5}
.owner-note{
  padding:10px 12px;background:#f7fbfe;border:1px solid #dce7ef;
  border-radius:8px;font-size:12px;color:#526d81;line-height:1.6;margin-bottom:10px
}
@media(max-width:640px){
  .grid{grid-template-columns:1fr}
  .full{grid-column:auto}
}

.shop-list-box{
  margin-bottom:14px;
  padding:16px;
  border:1px solid #dfe5ea;
  border-radius:12px;
  background:#fff;
}
.shop-list-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}
.shop-list-head h2{
  margin:0;
  font-size:18px;
}
.shop-count{
  font-size:12px;
  color:#6f7982;
}
.shop-list{
  display:grid;
  gap:8px;
}
.shop-item{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:10px;
  align-items:center;
  padding:11px 12px;
  border:1px solid #e3e8ec;
  border-radius:9px;
  background:#fafbfd;
}
.shop-item.current{
  border-color:#7db2df;
  background:#f2f8fd;
}
.shop-main{
  min-width:0;
}
.shop-name{
  font-size:14px;
  font-weight:900;
  color:#29323a;
  line-height:1.35;
}
.shop-meta{
  margin-top:3px;
  font-size:11px;
  color:#74808a;
  line-height:1.45;
  word-break:break-all;
}
.shop-open{
  white-space:nowrap;
  padding:9px 11px;
  font-size:12px;
  background:#fff;
  color:#3f6f98;
  border:1px solid #b9d2e6;
}
.shop-open:hover{
  background:#eef6fc;
}
.list-msg{
  padding:12px;
  border-radius:8px;
  background:#f7f9fb;
  color:#6f7982;
  font-size:12px;
}
.editing-badge{
  display:inline-block;
  margin-left:6px;
  padding:2px 7px;
  border-radius:999px;
  background:#4f8fc7;
  color:#fff;
  font-size:10px;
  vertical-align:middle;
}
@media(max-width:640px){
  .shop-list-box{padding:13px}
  .shop-item{
    grid-template-columns:1fr;
  }
  .shop-open{
    width:100%;
  }
}


/* 質問編集 */
.survey-manager{grid-column:1/-1;border:1px solid #dce7ef;background:#f7fbfe;border-radius:12px;padding:15px;display:grid;gap:12px}
.survey-switch{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800}
.survey-switch input{width:21px;height:21px;accent-color:#4f8fc7}
.survey-manager button{width:auto}
.survey-question-card{background:#fff;border:1px solid #d6e5ef;border-radius:10px;padding:13px;display:grid;gap:9px}
.survey-question-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.survey-mini-actions{display:flex;gap:5px;flex-wrap:wrap}
.survey-mini-actions button{padding:7px 9px;font-size:12px}
.survey-fields{display:grid;gap:9px}
.survey-fields label{display:grid;gap:5px}
.survey-option-row{display:grid;grid-template-columns:1fr auto;gap:6px;margin:6px 0}
.survey-option-row button{background:#fbecea;color:#9e3026}
.survey-help{font-size:12px;color:#657683;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>2027カレンダー｜営業所設定</h1>
    <p>オーナーが営業所ごとの受付URL・料金・アンケート・4桁PINを設定します。</p>
  </div>

  <div id="loginCard" class="card">
    <h2>オーナーログイン</h2>
    <div class="owner-note">
      Firebase Authenticationに登録したオーナー用パスワードでログインしてください。<br>
      営業所用4桁PINとは別です。
    </div>
    <input id="email" type="email" value="sp-fureai@soleil.ocn.ne.jp" readonly>
    <input id="password" type="password" autocomplete="current-password"
           placeholder="オーナー用Firebaseパスワード" style="margin-top:8px">
    <button id="loginBtn" class="primary" style="margin-top:10px">ログイン</button>
    <div id="loginMsg" class="msg"></div>
  </div>

  <div id="shopListBox" class="shop-list-box hidden">
    <div class="shop-list-head">
      <h2>登録済み営業所</h2>
      <span id="shopCount" class="shop-count"></span>
    </div>
    <div id="shopList" class="shop-list">
      <div class="list-msg">営業所一覧を読み込み中…</div>
    </div>
  </div>

  <div id="settingsCard" class="card hidden">
    <div class="grid">
      <label>営業所ID
        <input id="shopIdInput" placeholder="例：hatsukaichi-north">
      </label>

      <label>営業所コード
        <input id="shopCode" maxlength="4" placeholder="例：H">
      </label>

      <label class="full">営業所名
        <input id="shopName" placeholder="例：廿日市北営業所">
      </label>

      <label>A4料金（税込）
        <input id="a4Price" type="number" min="0" step="10">
      </label>

      <label>A3料金（税込）
        <input id="a3Price" type="number" min="0" step="10">
      </label>

      <label class="full">料金のかけ方
        <select id="pricingMode">
          <option value="firstFree">1枚目無料（2枚目から有料）</option>
          <option value="allPaid">1枚目から有料</option>
        </select>
      </label>

      <label class="full">営業所管理画面 4桁PIN
        <input id="adminPin" type="password" inputmode="numeric"
               maxlength="4" pattern="[0-9]{4}" placeholder="例：1234">
      </label>

      <div class="survey-manager">
        <label class="survey-switch"><input type="checkbox" id="surveyEnabled" checked>アンケートを表示する</label>
        <div class="survey-help">OFF、または質問をすべて削除して保存した場合、お客様の申込画面ではアンケートの枠・余白ごと表示しません。OFFでも質問は保持され、ONに戻すと再表示できます。質問ごとに回答形式・必須設定・選択肢を編集できます。</div>
        <div><button type="button" id="addSurveyBtn" class="primary">＋ 質問を追加</button></div>
        <div id="surveyEditorList"></div>
        <div><button type="button" id="resetSurveyBtn" class="ghost">基本の3問に戻す</button></div>
      </div>
    </div>

    <button id="saveBtn" class="primary" style="margin-top:14px">保存する</button>
    <button id="logoutBtn" class="ghost" style="margin-top:14px">ログアウト</button>
    <div id="msg" class="msg"></div>

    <div class="links">
      <b>保存後に使うURL</b>
      <div><small>お客様用</small><div id="customerUrl" class="url"></div></div>
      <div><small>営業所管理用</small><div id="adminUrl" class="url"></div></div>
      <div><small>設定用</small><div id="settingsUrl" class="url"></div></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, serverTimestamp, collection, getDocs
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
import {
  getFunctions, httpsCallable
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-functions.js";

const firebaseConfig={
  apiKey:"AIzaSyBKSYZgaSVTu-HO_lS1Tp2eFjSjMuOONNI",
  authDomain:"my-uchiwa-queue.firebaseapp.com",
  projectId:"my-uchiwa-queue",
  storageBucket:"my-uchiwa-queue.firebasestorage.app",
  messagingSenderId:"245883628081",
  appId:"1:245883628081:web:ab7f00f01ba256ebca8310",
  measurementId:"G-W4S3EKL9TY"
};

const OWNER_EMAIL="sp-fureai@soleil.ocn.ne.jp";
const $=id=>document.getElementById(id);

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);
const functions=getFunctions(app,"asia-northeast1");

const params=new URLSearchParams(location.search);
let shopId=(params.get("shop")||"main").replace(/[^a-zA-Z0-9_-]/g,"")||"main";

const defaults={
  shopName:"カレンダー受付営業所",
  shopCode:"C",
  a4Price:0,
  a3Price:0,
  pricingMode:"allPaid",
  surveyQuestion:"このカレンダー企画をどこで知りましたか？",
  surveyOptions:["新聞折込","営業所からの案内","家族・知人","その他"],
  surveyEnabled:true
};

$("loginBtn").onclick=async()=>{
  const email=$("email").value.trim().toLowerCase();
  const password=$("password").value;
  $("loginMsg").textContent="確認中…";

  if(email!==OWNER_EMAIL){
    $("loginMsg").textContent="この画面はオーナー専用です。";
    return;
  }
  if(!password){
    $("loginMsg").textContent="パスワードを入力してください。";
    return;
  }

  try{
    await signInWithEmailAndPassword(auth,email,password);
    $("loginMsg").textContent="";
  }catch(e){
    console.error(e);
    $("loginMsg").textContent=`ログインできませんでした。${e?.code?`（${e.code}）`:""}`;
  }
};

$("password").addEventListener("keydown",e=>{
  if(e.key==="Enter") $("loginBtn").click();
});

$("logoutBtn").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async user=>{
  const isOwner=!!user?.email && user.email.toLowerCase()===OWNER_EMAIL;

  $("loginCard").classList.toggle("hidden",isOwner);
  $("settingsCard").classList.toggle("hidden",!isOwner);
  $("shopListBox").classList.toggle("hidden",!isOwner);

  if(isOwner){
    await loadShopList();
    await loadSettings();
  }else if(user){
    await signOut(auth);
  }
});


function yen(v){
  return `¥${Number(v||0).toLocaleString("ja-JP")}`;
}

function pricingLabel(mode){
  return mode==="firstFree" ? "1枚目無料" : "1枚目から有料";
}

async function loadShopList(){
  const box=$("shopList");
  const countEl=$("shopCount");
  box.innerHTML='<div class="list-msg">営業所一覧を読み込み中…</div>';
  countEl.textContent="";

  try{
    const snap=await getDocs(collection(db,"settings"));
    const shops=[];

    snap.forEach(docSnap=>{
      const data=docSnap.data()||{};
      // 2027年間カレンダーで保存された営業所のみ表示
      if(data.annualCalendar2027Enabled===true){
        shops.push({
          id:docSnap.id,
          shopName:data.shopName||docSnap.id,
          shopCode:data.shopCode||"",
          a4Price:Number(data.a4Price||0),
          a3Price:Number(data.a3Price||0),
          pricingMode:data.pricingMode||"allPaid"
        });
      }
    });

    shops.sort((a,b)=>
      String(a.shopName).localeCompare(String(b.shopName),"ja")
    );

    countEl.textContent=`${shops.length}営業所`;

    if(!shops.length){
      box.innerHTML='<div class="list-msg">登録済み営業所はまだありません。</div>';
      return;
    }

    box.innerHTML=shops.map(s=>{
      const current=s.id===shopId;
      return `
        <div class="shop-item ${current?"current":""}" data-shop-id="${escapeHtml(s.id)}">
          <div class="shop-main">
            <div class="shop-name">
              ${escapeHtml(s.shopName)}
              ${current?'<span class="editing-badge">編集中</span>':""}
            </div>
            <div class="shop-meta">
              ID：${escapeHtml(s.id)}
              ${s.shopCode?` ／ コード：${escapeHtml(s.shopCode)}`:""}
              ／ A4 ${yen(s.a4Price)} ／ A3 ${yen(s.a3Price)}
              ／ ${pricingLabel(s.pricingMode)}
            </div>
          </div>
          <button class="shop-open" type="button" data-open-shop="${escapeHtml(s.id)}">
            設定を開く
          </button>
        </div>
      `;
    }).join("");

  }catch(e){
    console.error(e);
    box.innerHTML=`<div class="list-msg">営業所一覧を読み込めませんでした。${e?.code?`（${escapeHtml(e.code)}）`:""}</div>`;
  }
}

async function openShop(id){
  const safe=(id||"").replace(/[^a-zA-Z0-9_-]/g,"");
  if(!safe) return;

  shopId=safe;
  history.replaceState(null,"",`?shop=${encodeURIComponent(shopId)}`);
  await loadSettings();
  await loadShopList();

  $("settingsCard").scrollIntoView({behavior:"smooth",block:"start"});
}

$("shopList").addEventListener("click",async e=>{
  const btn=e.target.closest("[data-open-shop]");
  if(!btn) return;
  btn.disabled=true;
  try{
    await openShop(btn.dataset.openShop);
  }finally{
    btn.disabled=false;
  }
});

function escapeHtml(value){
  return String(value??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

const BASIC_SURVEY=[
  {id:"calendar-source",title:"アンケート①",description:"このカレンダー企画をどこで知りましたか？",type:"radio",required:false,options:["新聞折込","営業所からの案内","家族・知人","その他"]},
  {id:"subscription-status",title:"アンケート②",description:"現在の新聞購読状況を教えてください",type:"checkbox",required:false,options:["中国新聞を購読中","中国新聞デジタルを購読中","中国新聞以外の新聞を購読中","新聞は購読していない"]},
  {id:"subscription-interest",title:"アンケート③",description:"中国新聞を購読されていない方へ",type:"checkbox",required:false,options:["中国新聞を購読したい","中国新聞を試読（７日間無料）したい","資料だけ欲しい","今は希望しない"]}
];
let surveyDraft=[];
function normalizeSurvey(arr){
  return (Array.isArray(arr)?arr:BASIC_SURVEY).map((q,n)=>({
    id:String(q?.id||`question-${n+1}`),title:String(q?.title??`アンケート${n+1}`),
    description:String(q?.description??""),type:["radio","checkbox","select","textarea"].includes(q?.type)?q.type:"radio",
    required:q?.required===true,options:Array.isArray(q?.options)?q.options.map(String):[]
  }));
}
function syncSurvey(){
  document.querySelectorAll("#surveyEditorList .survey-question-card").forEach((card,n)=>{
    const q=surveyDraft[n];if(!q)return;
    q.title=card.querySelector('[data-field="title"]').value;
    q.description=card.querySelector('[data-field="description"]').value;
    q.type=card.querySelector('[data-field="type"]').value;
    q.required=card.querySelector('[data-field="required"]').checked;
    q.options=[...card.querySelectorAll('[data-option-input]')].map(el=>el.value);
  });
}
function renderSurveyEditor(){
  const list=$("surveyEditorList");
  list.innerHTML=surveyDraft.map((q,n)=>{
    const options=q.type!=="textarea";
    return `<div class="survey-question-card" data-index="${n}">
      <div class="survey-question-head"><strong>質問 ${n+1}</strong><div class="survey-mini-actions">
      <button type="button" class="ghost" data-action="up" ${n===0?"disabled":""}>↑ 上へ</button>
      <button type="button" class="ghost" data-action="down" ${n===surveyDraft.length-1?"disabled":""}>↓ 下へ</button>
      <button type="button" class="ghost" data-action="delete">削除</button></div></div>
      <div class="survey-fields">
      <label>見出し<input data-field="title" value="${escapeHtml(q.title)}"></label>
      <label>質問文<textarea data-field="description">${escapeHtml(q.description)}</textarea></label>
      <label>回答形式<select data-field="type">
      ${[["radio","1つだけ選択"],["checkbox","複数選択"],["select","プルダウン"],["textarea","自由記述"]].map(([v,t])=>`<option value="${v}" ${q.type===v?"selected":""}>${t}</option>`).join("")}
      </select></label><label class="survey-switch"><input type="checkbox" data-field="required" ${q.required?"checked":""}>回答を必須にする</label></div>
      ${options?`<div><strong>選択肢</strong>${q.options.map((v,k)=>`<div class="survey-option-row" data-option-index="${k}"><input data-option-input value="${escapeHtml(v)}"><button type="button" data-action="remove-option">削除</button></div>`).join("")}
      <button type="button" class="ghost" data-action="add-option">＋ 選択肢を追加</button></div>`:""}
    </div>`;
  }).join("") || '<div class="survey-help">質問がありません。「＋ 質問を追加」から作成できます。</div>';
  list.style.opacity=$("surveyEnabled").checked?"1":"0.55";
}
$("surveyEnabled").addEventListener("change",renderSurveyEditor);
$("surveyEditorList").addEventListener("change",e=>{if(e.target.matches('[data-field="type"]')){syncSurvey();renderSurveyEditor();}});
$("surveyEditorList").addEventListener("click",e=>{
  const btn=e.target.closest("button[data-action]");if(!btn)return;
  syncSurvey();const n=Number(btn.closest('[data-index]').dataset.index),a=btn.dataset.action;
  if(a==="delete")surveyDraft.splice(n,1);
  if(a==="up" && n>0)[surveyDraft[n-1],surveyDraft[n]]=[surveyDraft[n],surveyDraft[n-1]];
  if(a==="down" && n<surveyDraft.length-1)[surveyDraft[n+1],surveyDraft[n]]=[surveyDraft[n],surveyDraft[n+1]];
  if(a==="add-option")surveyDraft[n].options.push(`選択肢${surveyDraft[n].options.length+1}`);
  if(a==="remove-option")surveyDraft[n].options.splice(Number(btn.closest('[data-option-index]').dataset.optionIndex),1);
  renderSurveyEditor();
});
$("addSurveyBtn").onclick=()=>{syncSurvey();surveyDraft.push({id:`question-${Date.now()}`,title:`アンケート${surveyDraft.length+1}`,description:"",type:"radio",required:false,options:["選択肢1"]});renderSurveyEditor();};
$("resetSurveyBtn").onclick=()=>{if(confirm("質問を基本の状態に戻しますか？")){surveyDraft=normalizeSurvey(BASIC_SURVEY);renderSurveyEditor();}};

async function loadSettings(){
  $("shopIdInput").value=shopId;

  try{
    const snap=await getDoc(doc(db,"settings",shopId));
    const data=snap.exists()?{...defaults,...snap.data()}:{...defaults};

    $("shopName").value=data.shopName||"";
    $("shopCode").value=data.shopCode||"C";
    $("a4Price").value=Number(data.a4Price||0);
    $("a3Price").value=Number(data.a3Price||0);
    $("pricingMode").value=data.pricingMode||"allPaid";
    $("surveyEnabled").checked=data.surveyEnabled!==false;
    // 既存の自由編集済み質問は保持。従来の基本1問のみなら新しい基本3問を初期表示。
    const savedQuestions=Array.isArray(data.surveyQuestions)?data.surveyQuestions:null;
    const isLegacyBasicOnly=savedQuestions?.length===1 && savedQuestions[0]?.id==="calendar-source" && savedQuestions[0]?.description===defaults.surveyQuestion && JSON.stringify(savedQuestions[0]?.options)===JSON.stringify(defaults.surveyOptions);
    surveyDraft=normalizeSurvey(savedQuestions && !isLegacyBasicOnly?savedQuestions:BASIC_SURVEY);
    renderSurveyEditor();
    $("adminPin").value="";
  }catch(e){
    console.error(e);
    $("msg").textContent=`設定の読み込みに失敗しました。${e?.code?`（${e.code}）`:""}`;
  }

  renderUrls();
}

function currentShopId(){
  return ($("shopIdInput").value.trim()||"main")
    .replace(/[^a-zA-Z0-9_-]/g,"")||"main";
}

function renderUrls(){
  const id=currentShopId();
  const base=new URL(".",location.href);

  $("customerUrl").textContent=new URL(`index.html?shop=${id}`,base).href;
  $("adminUrl").textContent=new URL(`admin.html?shop=${id}`,base).href;
  $("settingsUrl").textContent=new URL(`settings.html?shop=${id}`,base).href;
}

$("shopIdInput").addEventListener("input",renderUrls);

$("saveBtn").onclick=async()=>{
  const id=currentShopId();
  const pin=$("adminPin").value.trim();
  syncSurvey();
  const questions=normalizeSurvey(surveyDraft).map(q=>({...q,title:q.title.trim(),description:q.description.trim(),options:q.options.map(v=>v.trim()).filter(Boolean)}));
  if($("surveyEnabled").checked && questions.some(q=>!q.description || (q.type!=="textarea" && !q.options.length))){
    $("msg").textContent="質問文と選択肢を入力してください。";return;
  }

  if(pin && !/^\d{4}$/.test(pin)){
    $("msg").textContent="営業所管理PINは数字4桁で入力してください。";
    return;
  }

  $("msg").textContent="保存中…";

  try{
    await setDoc(doc(db,"settings",id),{
      shopId:id,
      shopName:$("shopName").value.trim()||defaults.shopName,
      shopCode:($("shopCode").value.trim()||"C").toUpperCase(),
      a4Price:Number($("a4Price").value||0),
      a3Price:Number($("a3Price").value||0),
      pricingMode:$("pricingMode").value||"allPaid",
      surveyEnabled:$("surveyEnabled").checked,
      surveyQuestions:questions,
      surveyQuestion:questions[0]?.description||defaults.surveyQuestion,
      surveyOptions:questions[0]?.options?.length?questions[0].options:defaults.surveyOptions,
      annualCalendar2027Enabled:true,
      updatedAt:serverTimestamp()
    },{merge:true});

    if(pin){
      const setPin=httpsCallable(functions,"setAnnual2027AdminPin");
      await setPin({shopId:id,pin});
    }

    shopId=id;
    history.replaceState(null,"",`?shop=${encodeURIComponent(id)}`);
    $("adminPin").value="";
    $("msg").textContent=pin
      ?"保存しました。営業所管理画面は設定した4桁PINで開けます。"
      :"保存しました。";
    renderUrls();
    await loadShopList();

  }catch(e){
    console.error(e);
    $("msg").textContent=`保存できませんでした。${e?.code?`（${e.code}）`:""}`;
  }
};
</script>
</body>
</html>
